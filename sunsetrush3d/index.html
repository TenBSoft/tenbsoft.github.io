<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Rush 3D · 선셋 러시 3D</title>
<meta name="description" content="붉은 현수교를 건너 해안도로를 질주! 갈림길을 골라 21개 코스를 달리는 3D 아케이드 레이싱 / Race over bridges, coasts and snow passes. Pick your road through 21 courses!">
<meta property="og:title" content="Sunset Rush 3D · 선셋 러시 3D">
<meta property="og:description" content="Race over bridges, coasts and snow passes. Pick your road through 21 courses!">
<meta property="og:image" content="https://tenbsoft.github.io/sunsetrush3d/banner.jpg">
<link rel="icon" href="icon.png">
<style>
:root{--bg:#0f0a1f;--card:#1c1433;--ink:#fff4ec;--dim:#cdbfd9;--accent:#ff7a30;--accent2:#e2477f;--line:#392a57}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
     background:radial-gradient(ellipse at 50% 120%,#ff7a3040 0%,transparent 45%),radial-gradient(ellipse at 50% 15%,#3a1d55 0%,var(--bg) 70%);
     color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;line-height:1.7;
     word-break:keep-all;overflow-wrap:break-word}
.card{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:center}
.banner{display:block;width:100%;height:auto}
.body{padding:24px 28px 30px}
.app{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:1rem;text-align:left}
.app img{width:64px;height:64px;border-radius:15px;box-shadow:0 4px 18px #0007}
h1{margin:0;font-size:1.7rem;line-height:1.25}
.sub{color:var(--dim)}
p{margin:.4em 0;color:var(--dim)}
.btns{display:flex;flex-direction:column;gap:12px;margin:1.6em 0 1.2em}
a.btn{display:block;padding:14px 18px;border-radius:999px;text-decoration:none;font-weight:700;color:#fff;
      background:linear-gradient(90deg,var(--accent),var(--accent2))}
a.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.foot{margin-top:1.2em;font-size:.9rem;color:var(--dim)}
.foot a{color:var(--dim)}
@media (max-width:420px){.body{padding:22px 18px 26px}a.btn{padding:14px 12px}}
</style>
</head>
<body>
<div class="card">
  <img class="banner" src="banner.jpg" alt="Sunset Rush 3D: a red suspension bridge over the bay at sunset" width="1024" height="500">
  <div class="body">
    <div class="app"><img src="icon.png" alt="" width="64" height="64"><div><h1>선셋 러시 3D</h1><div class="sub">Sunset Rush 3D</div></div></div>

    <p>붉은 현수교를 건너 해안도로를 질주!<br>갈림길을 골라 21개 코스를 달리는 3D 아케이드 레이싱</p>
    <p>Race over bridges, coasts and snow passes.<br>Pick your road through 21 courses!</p>

    <div class="btns">
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.tenbsoft.sunsetrush3d">Google Play</a>
      <a class="btn ghost" href="privacy.html">개인정보처리방침 · Privacy Policy</a>
      <a class="btn ghost" href="terms.html">이용 약관 · Terms of Use</a>
    </div>

    <div class="foot">TenB Soft (tenbsoft) · <a href="mailto:zeal21@naver.com">zeal21@naver.com</a></div>
  </div>
</div>
</body>
</html>
